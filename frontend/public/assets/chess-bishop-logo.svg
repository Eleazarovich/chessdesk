<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask to cut out the classic diagonal bishop slit -->
    <mask id="slit-mask">
      <rect width="64" height="64" fill="white" />
      <line x1="38" y1="13" x2="28" y2="23" stroke="black" stroke-width="3" stroke-linecap="round" />
    </mask>

    <!-- Raw geometry of the bishop piece -->
    <g id="bishop-raw">
      <!-- Cross Finial -->
      <rect x="30.5" y="4" width="3" height="8" rx="1" />
      <rect x="28" y="6.5" width="8" height="3" rx="1" />
      
      <!-- Rounded Head -->
      <path d="M 24 26 C 21 18, 28 10, 32 10 C 36 10, 43 18, 40 26 Z" />
      
      <!-- Collar -->
      <rect x="23" y="25" width="18" height="3.5" rx="1.5" />
      
      <!-- Tapered Body with Waist -->
      <path d="M 21 51 C 24 42, 27 35, 25 26 L 39 26 C 37 35, 40 42, 43 51 Z" />
      
      <!-- Tiered Base -->
      <rect x="19" y="49" width="26" height="4" rx="2" />
      <rect x="16" y="52" width="32" height="6" rx="2" />
    </g>

    <!-- Combined shape with the slit applied -->
    <g id="bishop-shape" mask="url(#slit-mask)">
      <use href="#bishop-raw" />
    </g>

    <!-- Mask to create a crisp, 2px inner highlight on the left edge -->
    <mask id="highlight-mask">
      <use href="#bishop-shape" fill="white" />
      <use href="#bishop-shape" fill="black" transform="translate(2, 0)" />
    </mask>
  </defs>

  <!-- Solid Purple Base -->
  <use href="#bishop-shape" fill="#7c3aed" />

  <!-- Lighter Purple Left Highlight -->
  <use href="#bishop-shape" fill="#a78bfa" mask="url(#highlight-mask)" />
</svg>