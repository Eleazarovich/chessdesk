services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chessdesk
      POSTGRES_USER: chessdesk
      POSTGRES_PASSWORD: chessdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessdesk -d chessdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chessdesk:chessdesk@postgres:5432/chessdesk
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=development,service.version=0.1.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
    ports:
      - "8000:8000"
    networks:
      - default
      - observability

networks:
  observability:
    external: true
    name: chessdesk-otel

volumes:
  postgres_data:
