AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private ChessDesk metrics, logs, traces, and dashboards - runs separately from
  the application hosts and exposes Grafana only through an IAM-authorized SSM tunnel.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: dev/prod app SGs -> private Route 53 name -> OTLP collector; Grafana -> localhost + SSM port-forwarding
    must:
      - No security-group ingress from public CIDRs; OTLP gRPC ingress is limited to the dev and prod app security groups.
      - Grafana and Prometheus host ports remain bound to loopback; human access uses the fixed-port SSM session document and IAM policy.
      - Do not add SSH ingress or SSH keys.
      - Keep telemetry storage on the encrypted retained EBS volume.
    ref:
      - at: deploy/README.md
        has: Stack deployment, telemetry connection, and authorized Grafana access steps
        scope: same repository

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC shared with the dev and production application stacks.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet used for outbound package and container image downloads; inbound access remains restricted by the security group.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must match the selected subnet.
  LatestAmazonLinuxAmi:
    Type: AWS::EC2::Image::Id
    Default: ami-0a4da01d1a3d42967
    Description: Amazon Linux 2023 x86_64 AMI for af-south-1; override for another region.
  GitRef:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]{1,128}$'
    Description: Public repository branch or tag used to install the Compose project.
  DevAppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing dev app security group allowed to send OTLP gRPC telemetry.
  ProdAppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing production app security group allowed to send OTLP gRPC telemetry.
  DataVolumeSize:
    Type: Number
    Default: 32
    MinValue: 20
    MaxValue: 16384
    Description: Encrypted EBS data volume size in GiB.

Resources:
  GrafanaAdminPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Generates the initial Grafana admin credential and lets the host retrieve it at boot without storing it in the template or user data.
        must:
          - Never expose the secret value in stack outputs, metadata, or logs.
        mutable: change-with-constraints
    Properties:
      Description: !Sub Initial Grafana administrator password for ${AWS::StackName}.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  ObservabilitySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Permits telemetry from the two application hosts and allows HTTPS egress for SSM, package retrieval, and pinned public container images.
        must:
          - Keep all ingress limited to the two application security groups on TCP 4317 only.
          - Do not add public CIDR ingress, dashboard ingress, or SSH ingress.
        mutable: review-required
        mutability:
          SecurityGroupIngress: review-required
    Properties:
      GroupDescription: OTLP from ChessDesk dev and production; no public or admin ingress.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Dev OTLP gRPC telemetry.
          IpProtocol: tcp
          FromPort: 4317
          ToPort: 4317
          SourceSecurityGroupId: !Ref DevAppSecurityGroupId
        - Description: Production OTLP gRPC telemetry.
          IpProtocol: tcp
          FromPort: 4317
          ToPort: 4317
          SourceSecurityGroupId: !Ref ProdAppSecurityGroupId
      SecurityGroupEgress:
        - Description: HTTPS to AWS Systems Manager, package repositories, GitHub, and public image registries.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  ObservabilityInstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides the host's SSM control channel and read access to only its generated Grafana password.
        must:
          - Do not grant Run Command or broad Secrets Manager access to the host.
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadGrafanaAdminPassword
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GrafanaAdminPasswordSecret

  ObservabilityInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ObservabilityInstanceRole

  ObservabilityDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps Prometheus, Loki, Tempo, and Grafana state across host replacement; retains metrics, logs, and traces when the stack is deleted.
        must:
          - Keep the volume encrypted and in the host's Availability Zone.
          - Stack deletion or replacement leaves the volume retained and billable until separately deleted.
        mutable: change-with-constraints
        mutability:
          AvailabilityZone: must-never-change
          Encrypted: must-never-change
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-data'
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  ObservabilityInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs the separate Compose monitoring project on a 4 GiB host to keep its storage and CPU independent of the application servers.
        must:
          - Use IMDSv2, the SSM instance profile, and no SSH key.
          - Bind Grafana and Prometheus to loopback; the only network ingress is OTLP from the dev and production app security groups.
          - Store persistent service data on ObservabilityDataVolume, not the root disk.
        mutable: change-with-constraints
        mutability:
          NetworkInterfaces: review-required
          UserData: review-required
    Properties:
      ImageId: !Ref LatestAmazonLinuxAmi
      InstanceType: t3.medium
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      IamInstanceProfile: !Ref ObservabilityInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: 0
          GroupSet:
            - !Ref ObservabilitySecurityGroup
          SubnetId: !Ref PublicSubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -Eeuo pipefail
            exec > >(tee /var/log/chessdesk-observability-bootstrap.log | logger -t chessdesk-observability-bootstrap -s 2>/dev/console) 2>&1

            dnf install -y awscli-2 curl docker git xfsprogs
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 \
              --output /usr/local/lib/docker/cli-plugins/docker-compose
            chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
            systemctl enable --now docker
            docker compose version

            DATA_VOLUME_ID='${ObservabilityDataVolume}'
            DATA_VOLUME_SERIAL="$(printf '%s' "$DATA_VOLUME_ID" | tr -d '-')"
            DATA_DEVICE=''
            for attempt in $(seq 1 60); do
              DATA_DEVICE="$(lsblk -dnp -o NAME,SERIAL | awk -v expected="$DATA_VOLUME_SERIAL" '$2 == expected { print $1; exit }')"
              if [ -n "$DATA_DEVICE" ] && [ -b "$DATA_DEVICE" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$DATA_DEVICE" ] || [ ! -b "$DATA_DEVICE" ]; then
              echo "EBS data volume $DATA_VOLUME_ID did not appear" >&2
              exit 1
            fi
            if ! blkid "$DATA_DEVICE" >/dev/null 2>&1; then
              mkfs.xfs "$DATA_DEVICE"
            fi
            DATA_UUID="$(blkid -s UUID -o value "$DATA_DEVICE")"
            mkdir -p /data
            grep -q "UUID=$DATA_UUID" /etc/fstab || echo "UUID=$DATA_UUID /data xfs defaults,nofail 0 2" >> /etc/fstab
            mount /data
            mkdir -p /data/observability/{prometheus,loki,tempo,grafana}

            git clone --depth 1 --branch '${GitRef}' -- https://github.com/Eleazarovich/chessdesk.git /opt/chessdesk
            ADMIN_PASSWORD="$(aws secretsmanager get-secret-value \
              --secret-id '${GrafanaAdminPasswordSecret}' \
              --region '${AWS::Region}' \
              --query SecretString \
              --output text)"
            if [[ ! "$ADMIN_PASSWORD" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "Generated Grafana password did not match the expected safe format" >&2
              exit 1
            fi
            cat > /opt/chessdesk/observability/.env <<EOF
            GRAFANA_ADMIN_USER=admin
            GRAFANA_ADMIN_PASSWORD=$ADMIN_PASSWORD
            GF_SECURITY_COOKIE_SECURE=true
            OBSERVABILITY_DATA_DIR=/data/observability
            OTEL_COLLECTOR_BIND_ADDRESS=0.0.0.0
            EOF
            chmod 0600 /opt/chessdesk/observability/.env
            unset ADMIN_PASSWORD

            docker network inspect chessdesk-otel >/dev/null 2>&1 || docker network create chessdesk-otel
            docker compose \
              --project-directory /opt/chessdesk/observability \
              --env-file /opt/chessdesk/observability/.env \
              -f /opt/chessdesk/observability/compose.yaml \
              up --detach

            for attempt in $(seq 1 60); do
              if curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/health; then
                exit 0
              fi
              sleep 5
            done
            echo "Grafana did not become healthy" >&2
            exit 1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-host'
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  ObservabilityDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: Connects the separately retained data volume to the Docker host.
        must:
          - Keep the attachment and instance in the same Availability Zone.
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref ObservabilityInstance
      VolumeId: !Ref ObservabilityDataVolume

  ObservabilityPrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides a private stable collector name to app containers without publishing telemetry DNS outside the VPC.
        must:
          - Keep the zone associated only with the application VPC.
    Properties:
      Name: chessdesk.internal.
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region
      HostedZoneConfig:
        Comment: Private service records for ChessDesk observability.
      HostedZoneTags:
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  ObservabilityCollectorRecord:
    Type: AWS::Route53::RecordSet
    Metadata:
      com.aws.cloudformation.Context:
        why: Tracks the replaceable collector host's private address while app deployments keep using one stable endpoint.
        must:
          - Do not create a public hosted zone or public collector record.
    Properties:
      HostedZoneId: !Ref ObservabilityPrivateHostedZone
      Name: otel.chessdesk.internal.
      Type: A
      TTL: '60'
      ResourceRecords:
        - !GetAtt ObservabilityInstance.PrivateIp

  GrafanaPortForwardingSessionDocument:
    Type: AWS::SSM::Document
    Metadata:
      com.aws.cloudformation.Context:
        why: Gives operators one audited SSM tunnel to Grafana without granting an interactive shell or arbitrary remote port forwarding.
        must:
          - Fix the remote destination port at 3000 and do not add shell commands.
    Properties:
      DocumentType: Session
      Name: !Sub '${AWS::StackName}-GrafanaPortForwarding'
      Content:
        schemaVersion: '1.0'
        description: Port-forward to the private ChessDesk Grafana UI only.
        sessionType: Port
        parameters:
          localPortNumber:
            type: String
            description: Local browser port for Grafana.
            default: '3000'
            allowedPattern: '^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
        properties:
          portNumber: '3000'
          localPortNumber: '{{ localPortNumber }}'
          type: LocalPortForwarding
      Tags:
        - Key: Project
          Value: ChessDesk
        - Key: Environment
          Value: observability

  GrafanaAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides a reusable least-privilege policy for explicitly approved operators; it is intentionally not attached to an identity because no user or role was specified.
        must:
          - Allow only the Grafana forwarding document and this observability instance; never grant shell sessions or Run Command.
          - Scope password retrieval to this stack's generated secret.
    Properties:
      Description: !Sub Port-forward to ${AWS::StackName} Grafana and read its admin password.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StartGrafanaPortForwarding
            Effect: Allow
            Action: ssm:StartSession
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ObservabilityInstance}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${GrafanaPortForwardingSessionDocument}
          - Sid: OpenOwnPortForwardingChannel
            Effect: Allow
            Action: ssmmessages:OpenDataChannel
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:userid}-*
          - Sid: ManageOwnPortForwardingSession
            Effect: Allow
            Action:
              - ssm:GetConnectionStatus
              - ssm:ResumeSession
              - ssm:TerminateSession
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:userid}-*
          - Sid: DescribeSessionAndManagedNodeStatus
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
              - ssm:DescribeSessions
            Resource: '*'
          - Sid: ReadGrafanaAdminPassword
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GrafanaAdminPasswordSecret
Outputs:
  InstanceId:
    Description: Observability host managed by Systems Manager.
    Value: !Ref ObservabilityInstance
  PrivateIp:
    Description: Private address of the observability host.
    Value: !GetAtt ObservabilityInstance.PrivateIp
  CollectorEndpoint:
    Description: Private OTLP gRPC endpoint for the dev and production app containers.
    Value: http://otel.chessdesk.internal:4317
  GrafanaPortForwardingDocument:
    Description: SSM session document that forwards only to Grafana on port 3000.
    Value: !Ref GrafanaPortForwardingSessionDocument
  GrafanaAccessPolicyArn:
    Description: Attach this managed policy only to approved operator IAM roles or groups.
    Value: !Ref GrafanaAccessPolicy
  GrafanaAdminPasswordSecretArn:
    Description: Secrets Manager ARN for the Grafana admin password; the value is never exported.
    Value: !Ref GrafanaAdminPasswordSecret
  DataVolumeId:
    Description: Encrypted telemetry volume retained after stack deletion; it remains billable until separately deleted.
    Value: !Ref ObservabilityDataVolume
