AWSTemplateFormatVersion: '2010-09-09'
Description: Shared ChessDesk ECR repository with separate GitHub OIDC roles for publishing images, deploying dev, and protected production promotion.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: GitHub Actions OIDC -> separate build/dev/production roles -> ECR publishing or environment-scoped SSM commands
    must:
      - Trust audience is sts.amazonaws.com and subjects are limited to this repository's main branch and dev/production environments.
      - Keep the dev and production GitHub environments restricted to main with admin bypass disabled.
      - Only the production environment subject can obtain permissions to run commands on production instances.
    ref:
      - at: deploy/README.md
        has: Environment stack names, ECR setup, deployment selection, trust scope, and required outputs
        scope: same repository

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the existing token.actions.githubusercontent.com IAM OIDC provider.
  GitHubSubject:
    Type: String
    Default: repo:Eleazarovich@96009758/chessdesk@1358729767:ref:refs/heads/main
    Description: Exact immutable GitHub OIDC subject for the main branch image-build job.
  GitHubDevEnvironmentSubject:
    Type: String
    Default: repo:Eleazarovich@96009758/chessdesk@1358729767:environment:dev
    Description: Exact immutable GitHub OIDC subject for the dev deployment environment.
  GitHubProductionEnvironmentSubject:
    Type: String
    Default: repo:Eleazarovich@96009758/chessdesk@1358729767:environment:production
    Description: Exact immutable GitHub OIDC subject for the production deployment environment.
  ChessDeskDevStackName:
    Type: String
    Default: chessdesk-ec2
    Description: CloudFormation stack name for the dev environment.
  ChessDeskProdStackName:
    Type: String
    Default: chessdesk-ec2-prod
    Description: CloudFormation stack name for the production environment.

Resources:
  ChessDeskGitHubDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: lets main publish images; retains the existing logical role ID so updating the stack revokes deployment permissions from the previously shared role
        must:
          - Trust only the main-branch subject with sts.amazonaws.com audience.
          - Never grant Systems Manager commands or production deployment access to the build role.
          - Limit image publishing to the shared ChessDesk repository.
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: PublishChessDeskImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetECRAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushChessDeskImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ChessDeskImageRepository.Arn
      Tags:
        - Key: Project
          Value: ChessDesk

  ChessDeskGitHubDevRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: deploys only dev
        must:
          - Trust only the matching GitHub environment subject and sts.amazonaws.com audience.
          - Keep the environment restricted to main with admin bypass disabled.
          - Scope instance commands to the listed ChessDesk environment tags.
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubDevEnvironmentSubject
      Policies:
        - PolicyName: DeployChessDeskDev
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadEnvironmentStacks
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ChessDeskDevStackName}/*
              - Sid: UseShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: CommandEnvironmentInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: ChessDesk
                    ssm:resourceTag/Environment:
                      - dev
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
      Tags:
        - Key: Project
          Value: ChessDesk

  ChessDeskGitHubProductionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: reads the running dev release and promotes it to production, only from the protected production job
        must:
          - Trust only the matching GitHub environment subject and sts.amazonaws.com audience.
          - Keep the environment restricted to main with admin bypass disabled.
          - Scope instance commands to the listed ChessDesk environment tags.
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubProductionEnvironmentSubject
      Policies:
        - PolicyName: DeployChessDeskProduction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadEnvironmentStacks
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ChessDeskDevStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ChessDeskProdStackName}/*
              - Sid: UseShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: CommandEnvironmentInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: ChessDesk
                    ssm:resourceTag/Environment:
                      - dev
                      - prod
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
      Tags:
        - Key: Project
          Value: ChessDesk

  ChessDeskImageRepository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: provides one private image source for dev and production promotion; its physical name is shared by builder URIs and instance pull policy
        must:
          - Keep the physical repository name aligned with the CI image URI and EC2 pull policy
          - Keep tags immutable so a deployed dev tag continues to identify the promoted artifact
        mutable: change-with-constraints
    Properties:
      RepositoryName: chessdesk
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: ChessDesk

Outputs:
  RoleArn:
    Description: Legacy output for the build-only role; it no longer grants deployment access.
    Value: !GetAtt ChessDeskGitHubDeployRole.Arn
  BuildRoleArn:
    Description: Set as the GitHub repository secret AWS_BUILD_ROLE_ARN.
    Value: !GetAtt ChessDeskGitHubDeployRole.Arn
  DevRoleArn:
    Description: Set as AWS_DEV_ROLE_ARN in the dev GitHub environment.
    Value: !GetAtt ChessDeskGitHubDevRole.Arn
  ProductionRoleArn:
    Description: Set as AWS_PRODUCTION_ROLE_ARN in the protected production GitHub environment.
    Value: !GetAtt ChessDeskGitHubProductionRole.Arn
  ImageRepositoryUri:
    Description: Shared ECR repository receiving tagged ChessDesk build images.
    Value: !GetAtt ChessDeskImageRepository.RepositoryUri
