AWSTemplateFormatVersion: '2010-09-09'
Description: Shared ChessDesk ECR repository and GitHub Actions OIDC role for building and deploying releases.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: GitHub Actions OIDC -> scoped IAM role -> ECR image publishing and Systems Manager Run Command
    must:
      - Trust audience is sts.amazonaws.com and subject is this repository's main branch.
    ref:
      - at: deploy/README.md
        has: Environment stack names, ECR setup, deployment selection, trust scope, and required outputs
        scope: same repository

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the existing token.actions.githubusercontent.com IAM OIDC provider.
  GitHubSubject:
    Type: String
    Default: repo:Eleazarovich@96009758/chessdesk@1358729767:ref:refs/heads/main
    Description: Exact immutable GitHub OIDC subject allowed to assume this role.
  ChessDeskDevStackName:
    Type: String
    Default: chessdesk-ec2
    Description: CloudFormation stack name for the dev environment.
  ChessDeskProdStackName:
    Type: String
    Default: chessdesk-ec2-prod
    Description: CloudFormation stack name for the production environment.

Resources:
  ChessDeskGitHubDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: lets the main workflow publish releases and invoke dev/prod deployments with short-lived OIDC credentials instead of stored AWS keys
        must:
          - Trust only this repository's main subject with sts.amazonaws.com audience.
          - Run commands only on ChessDesk EC2 instances tagged Project=ChessDesk and Environment=dev or prod.
          - Limit image publishing to the shared ChessDesk repository.
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: ChessDeskDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadChessDeskStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ChessDeskDevStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ChessDeskProdStackName}/*
              - Sid: RunCommandsOnChessDeskInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: ChessDesk
                    ssm:resourceTag/Environment:
                      - dev
                      - prod
              - Sid: ReadDeploymentCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Sid: GetECRAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushChessDeskImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ChessDeskImageRepository.Arn
      Tags:
        - Key: Project
          Value: ChessDesk

  ChessDeskImageRepository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: provides one private image source for dev and production promotion; its physical name is shared by builder URIs and instance pull policy
        must:
          - Keep the physical repository name aligned with the CI image URI and EC2 pull policy
          - Keep tags immutable so a deployed dev tag continues to identify the promoted artifact
        mutable: change-with-constraints
    Properties:
      RepositoryName: chessdesk
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: ChessDesk

Outputs:
  RoleArn:
    Description: Set as the GitHub Actions AWS_ROLE_ARN secret.
    Value: !GetAtt ChessDeskGitHubDeployRole.Arn
  ImageRepositoryUri:
    Description: Shared ECR repository receiving tagged ChessDesk build images.
    Value: !GetAtt ChessDeskImageRepository.RepositoryUri
